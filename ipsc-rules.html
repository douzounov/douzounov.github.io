            bg: {
                fullRuleText: {
                "2.1.2.1": "2.1.2.1 По нареждане или съгласие на регионалния директор, могат да бъдат разрешени специфични допустими ъгли на стрелба (по-големи или по-малки). Нарушенията са обект на Правило 10.5.2. Пълните подробности за допустимите ъгли на стрелба и условия (напр.: намален вертикален ъгъл на цевта, ако пръста на състезателя е в пределите на спусковата скоба; вертикалният ъгъл на безопасност може да бъде ограничен до горните ръбове на защитните валове и др.), трябва да бъдат публикувани преди състезанието и трябва да са включени в писмения брифинг на сцената (виж също раздел 2.3).",
                "2.1.3": "2.1.3 Винаги, когато в курса на стрелба се използват метални мишени или метални твърди покрития, трябва да се вземат предпазни мерки състезателите и длъжностните лица да запазят минимална дистанция от 7 метра до тях, докато състезателят ги обстрелва. Където е възможно, това би трябвало да се направи с физически прегради. Ако се използват наказателни линии за ограничаване приближаването към метални мишени, те трябва да бъдат поставени на минимум 8 метра от мишените, така че дори когато състезателят неумишлено престъпи линията да остане извън минималната 7 метрова дистанция (виж Правило 10.4.7). Трябва да се обърне внимание и по отношение на металните реквизити по линията на стрелба.",
                "2.2.1.5": "2.2.1.5 Ако по време на курса на стрелба бъдат преминати видимите наказателни линии и/или ясно обозначеното за движение трасе, състезателя, който е преминал отвъд огражденията, ще получи по едно процедурно наказание за всеки произведен изстрел след излизане от ограничената зона.",
                "2.2.3.1": "2.2.3.1 Трябва да са достатъчно високи и здрави да служат за предвидената цел. Ако не са допълнение към платформа за стрелба, параваните високи поне 1,8 метра се смятат за високи до безкрай (виж Правило 10.2.11)",
                "2.3.3.3": "2.3.3.3 Състезател, който откаже да повтори даден курс на стрелба по нареждане на длъжностно лице в съответствие с разпоредбите на този или който и да е друг раздел, получава нулев резултат за тази сцена, без оглед на предишни опити.",
                "2.3.4.1": "2.3.4.1 Състезател, който бъде дисквалифициран на сцена, която в последствие отпадне от състезанието има право да продължи участие, ако Главния Съдия или Арбитражната комисия или техен упълномощен представител реши, че основанието за дисквалификация е обяснимо/аргументирано с причините довели до отпадане на сцената.",
                "2.4.4": "2.4.4 При никакви обстоятелства не трябва да се борави с бутафорна или истинска муниция, в насипно състояние, опакована или лентована в пълнители или зареждачки (виж Правило 10.5.12).",
                "4.7.1": "4.7.1 Оборудването на сцената трябва да представя курса на стрелба еднакво и безпристрастно на всички състезатели. Повреда в оборудването на сцената включва, но не се ограничава до: изместване на хартиени мишени, предварително активиране на метална или движеща се мишена, неизправност на механично или електронно оборудване и повреда в реквизита като врати, отвори и прегради.",
                "4.7.2": "4.7.2 Състезател, който не е в състояние да завърши курса на стрелба поради повреда в оборудването на сцената или поради не вдигната метална или незаредена движеща се мишена преди началото на стрелбата, трябва да повтори курса на стрелба след като се предприемат корективни действия.",
                "4.7.2.1": "4.7.2.1 Невъзстановена хартиена мишена не е повреда в оборудването на сцената (виж Правило 9.1.4)",
                "4.7.2.2": "4.7.2.2 Ако Главния Съдия прецени, че една или повече мишени в курса на стрелба са проблематични и/или са били поставени по начин, доста различен от положението им по-рано, той може да предложи повторно минаване на курса на стрелба на засегнатите състезатели.",
                "5.1.6": "5.1.6 Оръжията трябва да бъдат изправни и безопасни. Съдиите имат право по всяко време да извършват проверка на оръжието или екипировката на състезателя. Ако нещо се окаже неизправно или небезопасно, то трябва да бъде оттеглено от състезанието, докато не бъде поправено или приведено в състояние, задоволяващо Главния Съдия (виж и Правило 5.7.5).",
                "5.1.10": "5.1.10 Пистолети с приклади и/или предни ръкохватки от всякакъв вид са забранени (виж Правило 10.5.16).",
                "5.1.11": "5.1.11 Пистолети и гладкоцевни оръжия позволяващи стрелба на откоси или напълно автоматична стрелба (т.е. когато с едно натискане на спусъка могат да се произведат повече от един изстрел) са забранени (виж Правило 10.5.16).",
                "5.2.1.2": "5.2.1.2 Пистолет носен в кобур, трябва да е без пълнител и със спуснато чукче или декокнат. Неспазването на това води до предупреждение за първо нарушение, но всяко следващо нарушение по време на същото състезание ще бъде обект на разпоредбите на Правило 10.6.1.",
                "5.2.2": "5.2.2 Манипулация – с изключение на моментите, когато е в границите на безопасната зона или когато е под контрола и директните команди на Съдия, състезателите не трябва да боравят със своите оръжия. Думата \"боравене\" включва прибиране и вадене от кобур на оръжие, дори ако това се извършва скрито под защитно покритие и/или слагането или махането от колана на състезателя, дори оръжието да е изцяло или частично прибрано в кобур. Нарушенията са обект на Правило 10.5.1. Изключение: състезател, който е под наблюдението на съдия и погрешка извади от кобура своето огнестрелно оръжие, докато чака командата \"Заредете и пригответе\" или \"Пригответе се\" ще (при условие, че не е извършено друго нарушение на безопасността или забранена дейност) носи предупреждение за първия такъв случай, но ще бъде предмет на Правило 10.5.1 за последващи събития в същия мач.",
                "5.2.5": "5.2.5 Когато дадена дивизия изисква максимална дистанция, на която пистолетът и оборудването могат да бъдат от тялото на състезателя, съдията може да провери това измервайки най-близкото разстояние между тялото на състезателя и средата на края на ръкохватката на пистолета и/или пълнителите или зареждачките.\n\n5.2.5.1 Измерването трябва да се направи докато състезателят стои в отпуснато положение (виж приложение Е2).\n\n5.2.5.2 Всеки състезател, който не премине горепосочения тест, преди стартовия сигнал ще бъде задължен да нагласи кобура и оборудването си така, че да отговаря на изискванията на съответната дивизия. Главният Съдия може да прояви снизхождение при отклонения от тези изисквания, по анатомични съображения. Някои състезатели може да не са в състояние напълно да ги удовлетворят.",
                "5.2.7.3": "5.2.7.3 Кобур, който позволява цевта на прибрания в него пистолет да сочи на разстояние по голямо от 1 метър от ходилата на състезателя при изправено положение;",
                "5.4.3": "5.4.3 Ако съдията забележи, че състезател е изгубил или са му се разместили предпазните средства за зрението или слуха по време на курса на стрелба или че е започнал курса на стрелба без тях, той трябва незабавно да спре състезателя и да нареди повторение на курса на стрелба, след като предпазните средства бъдат поставени правилно.",
                "5.5.4": "5.5.4 Бронебойни, запалителни и/или трасиращи боеприпаси са забранени в състезанията по правилата на IPSC (виж Правило 10.5.16).",
                "5.5.5": "5.5.5 Боеприпас, който при един изстрел изстрелва повече от един куршум или проектил е забранен (виж Правило 10.5.16).",
                "5.5.6": "5.5.6 Боеприпас, който по преценка на съдията е небезопасен, трябва незабавно да се изтегли от състезанието (виж Правило 10.5.16).",
                "5.7.5": "5.7.5 Когато оръжието се повреди като гореописаното, състезателят няма право да повтори съответния курс на срелба. Това включва случаи, когато оръжието на състезателя е обявено за неизправно или небезопасно по време на курса на стрелба (виж Правило 5.1.6).",
                "5.7.6.2": "5.7.6.2 Ако съдията открие, че подозирания проблем не съществува, състезателят ще трябва да повтори курса на стрелба.",
                "5.7.6.3": "5.7.6.3 Състезател, който сам прекрати стрелбата по подозрение за или при фактически \"капсен заряд\" няма право на повторение на курса на стрелба.",
                "5.8.1.2": "5.8.1.2 Официалният боеприпас на състезанието, закупен от състезателя се счита за негова екипировка (виж раздел 5.7), следователно всякакви неизправности от страна на боеприпаса не са основание за повторение на курса на стрелба и/или за подаване на жалби до арбитражната комисия.",
                "6.2.3": "6.2.3 Преди началото на състезанието всеки състезател декларира дивизията в която ще се състезава и длъжностните лица би трябвало да проверят съответствието на екипировката му с декларираната дивизия, преди състезателят да е започнал преминаването на който и да било курс на стрелба. Това е услуга за подпомагане на състезателите да удостоверят, че тяхното оборудване, в конфигурацията, в която е представено, е в съответствие с декларираната от тях дивизия. Все пак състезателите винаги си остават обект на разпоредбите на Правило 6.2.5.1.",
                "6.2.5.1": "6.2.5.1 Състезател на когото оръжието и съпътстващата екипировка е разположена на по голяма дистанция от тялото от максимално разрешената (виж Приложения D1-D5) или престъпва границите на ограничителните линии (виж Приложение Е2) в нарушение на изискванията на заявената Дивизия след стартовия сигнал, ще получи предупреждение за първия случай. Последващо нарушение в същия мач ще доведе до преместване на състезателя в Дивизия OPEN, ако има такава, в противен случай резултатите му няма да бъдат включени в класирането. Ако състезателят е вече регистриран в Дивизия OPEN и след стартовия сигнал се открият несъответствия в упоменатите изисквания, ще получи предупреждение за първия случай, но в случай на повторно нарушение в същия мач, резултатите му няма да бъдат включени в класирането. Ако след стартовия сигнал се открият несъответствия с други изисквания на заявената Дивизия (освен упоменатите по горе), следва преместване на състезателя в Дивизия OPEN, ако има такава, в противен случай резултатите му няма да бъдат включени в класирането. Ако състезателят е вече регистриран в Дивизия OPEN и след стартовия сигнал се открият несъответствия с други изисквания на Дивизия OPEN (освен упоменатите по горе), резултатите му няма да бъдат включени в класирането. Това правило не се прилага за измервания направени в съответствие с Правило 5.2.5, нито преди (виж Правило 6.2.3), нито след като състезателят е отстрелял сцената.",
                "8.1.1.2": "8.1.1.2 С двойно/избирателно действие: чукчето напълно спуснато и затворен цилиндър. Ако самозарядни пистолети се подготвят \"без пълнител и патрон в цевта\", то револверите се подготвят с празен барабан, в противен случай те се подготвят с напълно зареден цилиндър.",
                "8.1.2.5": "8.1.2.5 Ако пистолета има декокер, единствено той трябва да се ползва за декокване на чукчето, без да се докосва спусъка. Ако пистолета е без декокер, чукчето трябва да се спусне ръчно, по безопасен начин, до крайно предно положение (т.е. не на полувзвод или друго подобно междинно положение).",
                "8.3.1": "8.3.1 \"Load And Make Ready\"/ Зареди и се подготви /(или \"Make Ready\"/Подготви се/ при стартова позиция с незаредено оръжие) – Тази команда обозначава началото на курса на стрелба. Под непосредствения надзор на Съдията на сцената, състезателят трябва да застане с лице към сцената или в безопасна посока, определена от Съдията, да постави предпазните си средства за защита на слуха и зрението и да подготви оръжието си според указанията на писмения брифинг. След това трябва да заеме изискваната стартова позиция. В този момент Съдията продължава с командите.",
                "8.3.1.1": "8.3.1.1 След издаването на съответната командата, състезателят няма право да напуска стартовата позиция до стартовия сигнал, без изричното разрешение и непосредствения надзор на Съдията на сцената. Нарушението на това правило води до предупреждение при първо провинение и може да доведе до приложението на Правило 10.6.1 при повторно нарушение в рамките на състезанието.",
                "8.3.7": "8.3.7 \"If Clear, Hammer Down, Holster\"/Ако е празно, пусни чукчето, прибери в кобура/ - След издаването на тази команда, състезателят няма право да възобнови стрелбата (виж Правило 10.6.1). Продължавайки да държи оръжието, насочено в безопасна посока към мишените, състезателят трябва да извърши финална проверка на оръжието както следва:\n\n8.3.7.1 Самозарядни пистолети – да освободи затворния блок и да натисне спусъка (без да докосва чукчето или декокера, ако има такъв). Ако пистолет е устроен така, че да изисква да има вкаран пълнител, за да стане възможно дърпането на спусъка, състезателя трябва при издаване на горната команда да уведоми Съдията, който ще ръководи и контролира използването и последващото отстраняване на празен пълнител, за да се улесни този процес.\n\n8.3.7.2 Револвери – да затвори празния барабан (без да докосва чукчето, ако има такова)\n\n8.3.7.3 Ако се окаже, че оръжието е празно, състезателят трябва да го прибере в кобура. Моментът, в който ръцете на сътезателя се отделят от прибраното оръжие се счита за края на курса на стрелба.\n\n8.3.7.4 Ако се окаже, че оръжието не е празно, Съдията възобновява командите от Правило 8.3.6 (виж също Правило 10.4.3).",
                "8.5.1": "8.5.1 Освен в случаите, когато състезателят действително е прицелен или стреля в мишените, всички движения трябва да се извършват с пръсти, ясно видими извън спусковата скоба и по възможност със заключен външен предпазител. Оръжието трябва да е насочено в безопасна посока. Под \"движение\" се разбира всяко от следните действия:\n\n8.5.1.1 Правене на повече от една стъпка в една посока.\n\n8.5.1.2 Смяна на позицията за стрелба (напр. от правостоящ към стрелба от коляно или от седнал в правостоящ и т.н.)",
                "8.6.1": "8.6.1 Не е разрешено подпомагане от какъвто и да било вид на състезателя по време на курса на стрелба, с изключение на предупреждения, свързани с безопасността, които всеки Съдия, работещ на дадената сцена има право да издава по всяко време. Такова предупреждение не може да бъде предпоставка за повторение курса на стрелба (reshoot).",
                "8.6.2": "8.6.2 Всеки, който извърши подпомагане на състезател по време на курса на стрелба без предварителното одобрение на Съдия (както и самият състезател, получил подпомагането), могат по преценка на Съдия, да получат по едно процедурно наказание за дадената сцена и/или да бъдат обект на разпоредбите на раздел 10.6.",
                "8.6.3": "8.6.3 Всяко лице намесило се вербално или по някакъв друг начин по време на преминаване курса на стрелба на състезател може да бъде обект на Раздел 10.6. Ако Съдията вярва, че вмешателството значително се е отразило на състезателя, той трябва да докладва за това на Главния Съдия, който може по своя преценка да предложи на засегнатия състезател престрелване.",
                "8.6.4": "8.6.4 В случай на неумишлен контакт между състезателя и Съдията на сцената или друго външно влияние върху състезателя по време на курса на стрелба, Съдията на сцената може да предложи на състезателя да повтори курса на стрелба. Състезателят трябва да приеме или откаже предложението преди да е видял времето или резултатите от първоначалния си опит. Ако все пак състезателят е извършил нарушение на правилата за безопасност, могат да се приложат разпоредбите на Раздел 10.4 и 10.5.",
                "8.6.5": "8.6.5 В случай, че което и да е лице се окаже в направлението на мишените пред състезателя по време на изпълнение на курса на стрелба, състезателят незабавно трябва да бъде спрян и след възстановяване на упражнението да го престреля. Ако състезателят е открил този проблем преди Съдията, той е длъжен незабавно да спре, да прекрати стрелбата, да насочи оръжието в безопасна посока и да чака по-нататъшните инструкции на Съдията. Все пак, обаче, ако състезателят не изпълни тази процедура, ще бъдат приложени разпоредбите на Раздели 10.4 и 10.5.",
                "8.7.1": "8.7.1 На състезателите е забранено да извършват прицелване и/или \"сух\" огън преди стартовия сигнал. Нарушението на това правило води до забележка при първо провинение и процедурно наказание за всяко следващо по време на това състезание. Състезателите могат да нагласят електронните мерници, насочвайки своите оръжия директно към земята пред себе си.",
                "8.7.2": "8.7.2 На състезателите е забранено да използват всякакви помощни средства (напр. цели или части от имитации или реплики на оръжия, части от истински оръжия, включително аксесоари за тях и т.н.) по време на разглеждане курса на стрелба (т.нар. \"сухо\" минаване). Всяко нарушение води до едно процедурно наказание (виж също Правило 10.5.1).",
                "8.7.3": "8.7.3 Никой няма право да влиза или да се разхожда в курса на стрелба, без предварително разрешение на Съдията на сцената или Главния Съдия. Нарушенията пораждат предупреждение за първо провинение, но могат да станат обект на разпоредбите на Раздел 10.6 при последващи провинения.",
                "9.1.1": "9.1.1 Приближаване към мишените - По време на отчитане на резултатите, състезателят или неговият пълномощник нямат право да приближават която и да била мишена на разстояние по-малко от 1 метър без разрешението на Съдията. Първото нарушение на това правило се наказва с предупреждение, но всяко следващо може да доведе до налагане на процедурно наказание по усмотрение на Съдията.",
                "9.1.2": "9.1.2 Докосване на мишените - По време на отчитане на резултатите, състезателят или неговият пълномощник нямат право да докосват, калиброват или по друг начин да въздействат върху която и да била мишена без разрешението на Съдията. Ако Съдията прецени, че състезателя или неговия пълномощник са повлияли на процеса на оценяването вследствие такова тяхно действие той може да предприеме следното:\n\n9.1.2.1 Ако мишената е зачетна да я оцени като пропусната; или\n\n9.1.2.2 Ако мишената е наказателна да отбележи попадения в нея.",
                "9.1.3": "9.1.3 Предварително залепени мишени - Ако някоя мишена бъде залепена преди нейното отчитане и това доведе до невъзможност за правилното отчитане на резултата, Съдията е длъжен да нареди на състезателя да повтори курса на стрелба.",
                "9.1.4": "9.1.4 Незалепени мишени - Ако след завършване на сцената се установи, че една или няколко мишени не са били предварително залепени, Съдията трябва да реши дали е възможно правилното отчитане на резултата. Ако върху въпросната мишена има повече попадения и не е ясно точно кои са на оценявания състезател, той трябва да повтори курса на стрелба.",
                "9.1.4.1": "9.1.4.1 В случай че някоя лепенка се отлепи от хартиена мишена вследствие на вятър, въздушната струя от цевта или по каквато и да е друга причина и Съдията не е в състояние да установи кои точно попадения са на оценявания състезател, той трябва да нареди повторение на курса на стрелба.",
                "9.1.4.2": "9.1.4.2 Състезател, който се поколебае или спре сам по време на преминаването на курса на стрелба, поради съмнение, че една или повече мишени не са били залепени или възстановени, не подлежи на повторение на курса на стрелба.",
                "9.1.5.1": "9.1.5.1 Куршумът премине с цялата си част през оценъчната площ на хартиена мишена и продължавайки полета си попадне в друга хартиена мишена, то поразяването на втората мишена не се оценява като попадение или наказание.",
                "9.1.5.2": "9.1.5.2 Куршумът премине с цялата си част през оценъчната площ на хартиена мишена и продължавайки полета си събори метална мишена, това се смята за повреда в оборудването на сцената и състезателят трябва да повтори курса на стрелба.",
                "9.1.5.3": "9.1.5.3 Куршумът удари частично оценъчната площ на хартиена или метална мишена и продължавайки полета си попадне в друга хартиена мишена, то поразяването на втората мишена се отчита като попадение или наказание, в зависимост от предназначението на мишената.",
                "9.1.5.4": "9.1.5.4 Куршумът удари частично оценъчната площ на хартиена или метална мишена и продължавайки полета си събори (или попадне в оценъчната площ на) друга метална мишена, то поразяването на втората мишена се отчита като попадение или наказание, в зависимост от предназначението на мишената.",
                "9.1.6.1": "9.1.6.1 Куршумът премине с цялата си част през твърдо покритие и продължавайки полета си попадне в зачетната зона на зачетна хартиена или наказателна мишена, то попадението в хартиената или наказателна мишена не се зачита. Ако не може да се определи кое(и) попадение(я) са в резултат от прострелване на твърдото покритие, мишените се оценяват, като не се вземат под внимание съответния брой най-добри попадения.",
                "9.1.6.2": "9.1.6.2 Куршумът премине с цялата си част през твърдо покритие и продължавайки полета си събори метална мишена, това се смята за повреда в оборудването на сцената (виж Правило 4.7.1) и състезателят трябва да повтори курса на стрелба, след възстановяването му.",
                "9.1.6.3": "9.1.6.3 Куршумът удари частично твърдо покритие и продължавайки полета си попадне в хартиена мишена, то попадението в мишената се зачита.",
                "9.1.6.4": "9.1.6.4 Куршумът удари частично твърдо покритие и продължавайки полета си събори метална мишена, то попадението в металната мишена се зачита. Ако куршумът удари частично твърдо покритие и продължавайки полета си порази или събори метална наказателна мишена, то попадението се отчита като наказание.",
                "9.1.7": "9.1.7 Стойки на мишените - не са нито \"твърдо\" нито \"меко\" покритие. Всички попадения преминали напълно или частично през стойките и поразили хартиена или метална мишена се зачитат като попадение или наказание, в зависимост от предназначението на мишената.",
                "9.4.2": "9.4.2 Всяко видимо попадение в оценъчната зона на хартиена наказателна мишена води до наказание от минус 10 точки. Наказват се максимум две попадения във всяка наказателна мишена.",
                "9.7.4": "9.7.4 Оценъчният лист, подписан от състезателя и Съдията, е окончателно доказателство, че курса на стрелба е завършил и че времето и резултатите записани в него са верни и не подлежат на контестация. Двустранно подписаният оценъчен лист се смята за окончателен документ и с изключение на случаите на взаимно съгласие между състезателя и Съдията или решение на арбитражната комисия, промени в него могат да се правят единствено за оправяне на аритметични грешки или за вписване на процедурни наказания по Правило 8.6.2.",
                "9.7.6": "9.7.6 Ако по една или друга причина повторението на курса на стрелба не е възможен, се предприемат следните действия:\n\n9.7.6.1 Ако липсва времето, то състезателят получава нулев резултат за дадената сцена.\n\n9.7.6.2Ако са записани по малко попадения от необходимите, тези които са записани се приемат за пълни и окончателни.\n\n9.7.6.3 Ако са записани повече попадения от необходимите, то под внимание се вземат необходимият брой най-високи стойности.\n\n9.7.6.4 Процедурните наказания вписани в оценъчния лист се приемат за пълни и окончателни освен в случаите на приложение на Правило 8.6.2.\n\n9.7.6.5 Ако липсва идентификацията на състезателя, случаят се отнася до Главния Съдия на мача, който трябва да предприеме действия по свое усмотрение за решаване на ситуацията.",
                "9.7.8": "9.7.8 На никой друг, освен на оторизираните длъжностни лица не е позволено да борави/пипа оригиналните оценъчни листа, пазещи се на сцената или на което и да е друго място след като са били подписани от състезателя и Съдията, без предварителното одобрение на Съдията или персонала директно отговорен за статистиката. Нарушението на това правило се наказва с предупреждение за първо нарушение, но може да подлежи на санкция според Раздел 10.6 за следващо нарушение в рамките на един и същи мач.",
                "9.9.2": "9.9.2 Движещи се мишени, които не изпълняват горните условия са криещи се и не носят наказания за необстрелване и/или липсващи попадения (miss), освен ако състезателя не пропусне да активира механизма за задвижването им преди или с последния изстрел за тази курс на стрелба.",
                "9.10.2": "9.10.2 Ако, според мнението на арбитражната комисия, времето записано в оценъчния лист на даден състезател изглежда нереалистично, той трябва да повтори курса на стрелба (виж Правило 9.7.4).",
                "10.1.1": "10.1.1 Процедурни наказания се налагат тогава, когато състезателят не спази процедурите, изрично упоменати в писмения брифинг на сцената и/или е открито нарушение на друго главно правило. Съдията налагащ процедурните наказания, трябва ясно да запише броя на наказанията и причината за тяхното налагане в оценъчния лист на състезателя.",
                "10.1.2": "10.1.2 Всяко процедурно наказание се равнява на минус 10 точки.",
                "10.1.3": "10.1.3 Състезател, несъгласен с получаването или броя на процедурните наказания, може да се обърне към главния съдия на сцената (CRO) и/или към главния съдия на мача (RM). Ако състезателят продължава да е неудовлетворен от тяхното решение, той има право да депозира жалба до арбитражната комисия.",
                "10.1.4": "10.1.4 Процедурните наказания не могат да бъдат анулирани от последващи действия на състезателя. Например, състезател, който стреля по мишена, престъпвайки наказателна линия, ще получи приложимите процедурни наказания, дори в последствие да стреля по същата мишена без да престъпва съответната линия.",
                "10.2.1": "10.2.1 Състезател, който стреля докато която и да е част от тялото му докосва земята или някакъв друг предмет отвъд наказателна линия, се наказва с едно процедурно наказание. Не се дава наказание ако състезателят не осъществи изстрел докато престъпва линията с изключение на случаите, когато се прилага правило 2.2.1.5.\n\n10.2.1.1 Когато състезателят печели значително преимущество, обстрелвайки дадена мишена/и докато престъпва линията, той може да получи по едно процедурно наказание за всеки изстрел по съответната мишена.",
                "10.2.2": "10.2.2 Състезател, който не спази процедура, изрично упомената в писмения брифинг на сцената се наказва с едно процедурно наказание. Когато състезателят печели значително преимущество, неспазвайки съответната процедура, той може да получи по едно про- цедурно наказание за всеки осъществен изстрел (например, стреляйки веднъж или многократно от място, стрелкова позиция или положение несъответстващи на тези, описани в брифинга).",
                "10.2.3": "10.2.3 Когато се налагат многократни наказания по горните случаи, те не трябва да превишават максималния брой възможни зачетни попадения, постижими от състезателя. Например състезател, който печели значително преимущество, престъпвайки наказателна линия, откъдето са видими само 4 метални мишени, може да получи максимално 4 процедурни наказания, без оглед на реално осъществените изстрели.",
                "10.2.4": "10.2.4 Състезател, който не спази условие за задължително презареждане, получава по едно процедурно наказание за всеки изстрел след мястото определено за презареждане, докато не осъществи презареждането.",
                "10.2.5": "10.2.5 В тунела на Купър, състезателят получава по едно процедурно наказание за всяка съборена летва. Ако летва падне вследствие сблъсък на състезателя със страничните подпори или в резултат на барутни газове от цевта или откат на оръжието, не се налага процедурно наказание.",
                "10.2.6": "10.2.6 Състезател, който посяга към оръжието си, пълнител или боеприпаси или физически се придвижва към по изгодна позиция или поза след командата \"Standby\" и преди стартовия сигнал, получава едно процедурно наказание. Ако съдията има възможност да спре състезателя навреме, той получава предупреждение за първо нарушение и започва курса на стрелба отново.",
                "10.2.7": "10.2.7 Състезател, който не успее да обстреля оценъчна мишена поне с един изстрел, получава по едно процедурно наказание за всяка необстреляна мишена ведно с приложимите наказания за липсващи попадения, освен в случаите на Правило 9.9.2.",
                "10.2.8": "10.2.8 Ако курсът на стрелба (или част от него) постановява стрелба само със силна или слаба ръка, състезателя ще понесе по едно процедурно наказание за всяко възникнало докосване на оръжието (загребването му от маса и др. подобни) с другата ръка след стартовия сигнал (или от мястото, където е предвидена стрелбата с една ръка). Изключения са освобождаването на външния предпазител (без загребване), презареждане или отстраняване на неизправност. Все пак процедурно наказание ще бъде дадено за всеки произведен изстрел, основно когато състезателя използва другата си ръка или рамо за:\n\n10.2.8.1 придържане на пистолета или осигуряване на китка или ръка докато стреля;\n\n10.2.8.2 увеличаване на стабилноста на земя, параван или друга опора докато стреля.",
                "10.2.9": "10.2.9 Състезател, напуснал дадена позиция за стрелба има право, спазвайки всички мерки за безопасност, да се върне и да стреля от същата позиция. Писмените брифинги на някои класификационни курсове на стрелба или на състезания от 1-во и 2-ро ниво може да забраняват подобно действие. В такъв случай се налага по едно процедурно наказание за всеки осъществен изстрел.",
                "10.2.10": "10.2.10 Специално наказание: Състезател, който не е в състояние, следствие травма или друга физическа недостатъчност, да изпълни част от курса на стрелба, има право, преди началото на стрелбата, да помоли Главния Съдия на мача да му бъде наложено специално наказание вместо приложимите за случая наказания.\n\n10.2.10.1 Ако молбата е одобрена от Главния Съдия, той трябва да каже на състезателя преди той да е преминал курса на стрелба, големината на специалното наказание, намаление на точките на състезателя, събрани от съответния курс, в диапазона от 1% до 20%.\n\n10.2.10.2 Алтернативно, Главният Съдия може да се откаже от налагането на евентуални санкции по отношение на състезател, който поради наличието на значително физическо увреждане, не е в състояние да се съобрази с изискванията на курса на стрелба.\n\n10.2.10.3 Ако молбата е отхвърлена от Главния Съдия, ще се приложат нормалните процедурни наказания.",
                "10.2.11": "10.2.11 Състезател, който стреля над параван висок поне 1.80 см, ще понесе по едно процедурно наказание за всеки произведен изстрел (виж и Правило 2.2.3.1).",
                "10.3.1": "10.3.1 Състезател, който наруши правилата на безопасност или извърши каквото и да е забранено деяние по време на състезание по правилата на IPSC, се дисквалифицира, като до момента на произнасяне по контестацията му по реда на Глава 11 същият няма право да стреля оставащите му курсове на стрелба, независимо от графика на състезанието или физическото им разположение.",
                "10.4.1": "10.4.1 Изстрел над ограничителните валове или в посока, указана в писмения брифинг на сцената като небезопасна. Ако състезателят произведе легитимен изстрел по мишена, който след това продължи траекторията си в небезопасна посока, няма да бъде дисквалифициран, но в такъв случай могат да се приложат разпоредбите на Раздел 2.3.",
                "10.4.2": "10.4.2 Изстрел в земята на разстояние от състезателя по-малко от 3 метра, освен в случай на стрелба по хартиена мишена, разположена на разстояние по-малко от 3 метра от състезателя. Това правило не важи, ако изстрелът е с патрон с \"капсен заряд\".",
                "10.4.3": "10.4.3 Изстрел произведен по време на зареждане, презареждане или разреждане на оръжието. Това включва и изстрел по време на процедурите, описани в Правило 8.3.1 и Правило 8.3.7 (виж и Правило 10.5.10).\n\n10.4.3.1 Изключение – детонация, възникнала по време на разреждане на оръжието не се счита за изстрел водещ до дисквалификация, но в този случай могат да влязат в сила разпоредбите на Правило 5.1.6.",
                "10.4.4": "10.4.4 Изстрел, възникнал по време на отстраняване на засечка на оръжието.",
                "10.4.5": "10.4.5 Изстрел, възникнал при пренасянето на оръжието от едната в другата ръка.",
                "10.4.6": "10.4.6 Изстрел по време на движение, освен в случаите на действителна стрелба по мишени.",
                "10.4.7": "10.4.7 Изстрел по метална мишена, на разстояние по-малко от 7 метра, измерено от лицевата част на мишената до най-близката част от тялото на стрелеца, имаща досег със земята (виж Правило 2.1.3).",
                "10.4.8": "10.4.8 Ако може да се установи, че причината за случайния изстрел е повредена или дефектна част на оръжието, се смята че състезателят не е нарушил правилата за безопасност и няма да бъде дисквалифициран, но резултатът му за сцената ще бъде нула.\n\n10.4.8.1 Оръжието трябва незабавно да бъде предоставено на главния съдия или на негов пълномощник, който да го инспектира и проведе каквито тестове сметне за нужно за установяване, че причината за случайния изстрел е повредена или дефектна част. Състезател, който не предостави оръжието си за инспекция, преди да напусне курса на стрелба, губи правото си да обжалва дисквалификацията за случаен изстрел с мотивите че е причинен от повредена или дефектна част.",
                "10.5.1": "10.5.1 Боравене с оръжието по всяко време, освен в означените безопасни зони или под надзора на Съдията на сцената, реагирайки на неговите команди. (Ограничено изключение: виж Правило 5.2.2).",
                "10.5.2": "10.5.2 Насочването на оръжието над горната граница на ограничителните валове или извън дефинираните или допълнително определени ъгли на безопасност по време на курса на стрелба (ограничени изключения: виж Правила 2.1.2.1; 5.2.7.3 и 10.5.6).",
                "10.5.3": "10.5.3 Ако по време на курса на стрелба състезателят изпусне оръжието си или причини неговото падане на земята, без значение дали е заредено или празно. Състезател, който по една или друга причина по време на курса на стрелба, безопасно и умишлено положи оръжието си на земята или друг стабилен обект, няма да бъде дисквалифициран, при положение че:\n\n10.5.3.1 Състезателят поддържа постоянен физически контакт с оръжието, докато то бъде поставено сигурно и стабилно на земята или друг устойчив обект, и\n\n10.5.3.2 Състезателят запазва дистанция от 1 метър от оръжието през цялото време (освен когато оръжието се поставя на по голямо разстояние под надзора на Съдията на сцената, за да се спази стартовата позиция), и\n\n10.5.3.3 Не настъпят клаузите на Правило 10.5.2, и\n\n10.5.3.4 Оръжието е в положение, установено от Правило 8.1, или\n\n10.5.3.5 Оръжието е незаредено и затвора е отворен.",
                "10.5.4": "10.5.4 Прибирането и изваждането на оръжието от кобура в пределите на тунел",
                "10.5.5": "10.5.5 Насочването на цевта на пистолета към която и да било част от тялото на състезателя по време на курса на стрелба. Това не важи при вадене и прибиране на оръжието в кобур, при условие че пръстът на състезателя е несъмнено извън спусковата скоба.",
                "10.5.6": "10.5.6 Насочването на цевта на оръжието към която и да е част от тялото на друг човек (например Официално лице или зрител) по време на курса на стрелба. Дисквалификацията не е приложима, ако проблемът е възникнал следствие от действията на въпросното лице, което се появява пред състезателя по време на курса на стрелба, при условие, че състезателят спазва разпоредбите на Правило 8.6.5.",
                "10.5.7": "10.5.7 Допускането на цевта на зареден пистолет да сочи назад в радиус по-голям от 1 метър от ходилата на състезателя при вадене и прибиране в кобур. Условието за 1м е приложимо само когато състезтеля е с лице директно към сцената.",
                "10.5.8": "10.5.8 Носенето или използването на повече от едно оръжие по време на курса на стрелба.",
                "10.5.9": "10.5.9 Неизваждането на пръста от спусковата скоба при отстраняване на засечка, когато е ясно видимо, че състезателят не е прицелен в мишените.",
                "10.5.10": "10.5.10 Неизваждането на пръста от спусковата скоба при зареждане, презареждане и разреждане на оръжието, освен в случаите в които това е специално разрешено (виж Правила 8.1.2.4 и 8.3.7.1).",
                "10.5.11": "10.5.11 Неизваждането на пръста от спусковата скоба по време на движение съобразно Правило 8.5.1.",
                "10.5.12": "Прибиране на зареден пистолет в кобур в следното състояние:\n\n10.5.12.1 Самозаряден пистолет с единично действие с патрон в патронника и неспуснат предпазител.\n\n10.5.12.2 Самозаряден пистолет с двойно или селективно действие с вдигнато чукче и неспуснат предпазител.\n\n10.5.12.3 Револвер с вдигнато чукче.",
                "10.5.13": "10.5.13 Боравенето с истинска или бутафорна муниция в безопасна зона противоречащо на Правило 2.4.4.\n\n10.5.13.1 Терминът \"БОРАВЕНЕ\" не изключва възможността състезателите да влизат в Зоната за безопасност с боеприпаси в магазините или зареждачките разположени по колана, в джобовете или в чантата си, при условие че физически не ги вадят от местата им за съхранение докато са в Зоната за безопасност.",
                "10.5.14": "10.5.14 Наличие на заредено оръжие, освен при изричната команда на Съдия",
                "10.5.15": "10.5.15 Вдигането на изпуснато оръжие. Изпуснато оръжие задължително се вдига от Съдия, който след проверка и/или изчистване на оръжието, го поставя директно в куфарчето, чантата или кобура на състезателя. Изпускането или причиняването на падането на незаредено оръжие извън курса на стрелба не е нарушение, но вдигането му от състезателя води до дисквалификация.",
                "10.5.16": "10.5.16 Използването на забранени и/или небезопасни боеприпаси (виж Правила 5.5.4, 5.5.6 и 5.5.7) и/или използването на забранено оръжие (виж Правила 5.1.10 и 5.1.11).",
                "10.6.1": "10.6.1 Състезател може да бъде дисквалифициран за поведение, което Съдията сметне че е неспортсменско. Примерите включват, но не се ограничават от: измама, нечестност, неизпълнение на основателни указания на длъжностно лице, или всяко поведение, което може да развали репутацията на спорта. Главният Съдия трябва да бъде уведомен при първа възможност.",
                "10.6.2": "10.6.2 Състезател, който по мнението на Съдията умишлено е махнал или причинил падането на предпазните си средства за защита на зрението и слуха, с цел постигане на преимущество или престрелване, се дисквалифицира.",
                "10.7.3": "10.7.3 Освен когато са използвани с медицинска цел, състезателите и официалните лица не трябва да бъдат под влиянието на каквито и да било вещества (включително алкохол) по време на състезанията. Всеки, който според главния съдия е видимо под такова влияние, ще бъде диквалифициран от състезанието и може да бъде задължен да напусне стрелбището."
                },

                    { rule: "4.7.2.2", condition: "[GRANTED] Target(s) faulty or presented significantly differently than earlier presentations", action: "Range Master may offer reshoot to affected competitor(s)" },
                    { rule: "5.4.3", condition: "[GRANTED] Eye or ear protection lost/displaced OR course started without them", action: "Competitor must be required to reshoot after protective devices restored" },
                    { rule: "5.7.5", condition: "[DENIED] Firearm has failed (unserviceable or unsafe declared during course)", action: "Competitor must NOT be permitted to reshoot the course. See also Rule 5.1.6." },
                    { rule: "5.7.6.2", condition: "[GRANTED] Range Officer discovers suspected safety problem does not exist", action: "Competitor will be required to reshoot the stage" },
                    { rule: "5.7.6.3", condition: "[DENIED] Competitor self-stops due to suspected or actual squib load", action: "Competitor is NOT entitled to a reshoot" },
                    { rule: "5.8.1.2", condition: "[DENIED] Ammunition malfunction (official match ammunition)", action: "Malfunctions will NOT be grounds for reshoot and/or appeal to Arbitration" },
                    { rule: "8.6.1", condition: "[DENIED] Range Officer issues safety warnings to competitor during course", action: "Safety warnings will NOT be grounds for reshoot (warnings are permitted assistance)" },
                    { rule: "8.6.3", condition: "[GRANTED] Person verbally or otherwise interfering significantly affects competitor", action: "Range Master may offer reshoot at their discretion" },
                    { rule: "8.6.4", condition: "[GRANTED] Range Officer or other external influence inadvertently interferes with competitor", action: "Range Officer may offer competitor a reshoot" },
                    { rule: "8.6.5", condition: "[GRANTED] Person appears downrange during course of fire", action: "Competitor must immediately cease firing and be required to reshoot" },
                    { rule: "9.1.3", condition: "[GRANTED] Target prematurely patched/taped, preventing accurate score determination", action: "Range Officer must order competitor to reshoot" },
                    { rule: "9.1.4.2", condition: "[DENIED] Competitor hesitates/self-stops believing targets not restored/reset", action: "Competitor is NOT entitled to a reshoot" },
                    { rule: "9.7.6", condition: "[DENIED] Reshoot not possible for any reason", action: "Apply specific remedies: missing time = zero score; recorded hits/misses/penalties = deemed conclusive; missing competitor ID = Range Master determines action. See also Rule 8.6.2." },
                    { rule: "9.10.2", condition: "[GRANTED] Arbitration Committee deems time credited to competitor unrealistic", action: "Competitor will be required to reshoot. See also Rule 9.7.4." }
                ]
            },
            scoring: {
                title: "Scoring",
                titleKey: "sectionTitleScoring",
                description: "Rules for target scoring, hit evaluation, and handling of damaged or impenetrable targets.",
                descKey: "sectionDescScoring",
                type: "scoring",
                rows: [
                    { rule: "9.1.1", condition: "Approaching targets closer than 1 meter during scoring without Range Officer authorization", action: "Warning for first offense; subsequent violations may incur procedural penalty at Range Officer discretion" },
                    { rule: "9.1.2", condition: "Touching, gauging, or interfering with target during scoring without Range Officer authorization", action: "Range Officer may score affected target as missed OR impose penalties for affected no-shoots" },
                    { rule: "9.1.3", condition: "Target prematurely patched/taped, preventing score determination", action: "Competitor must be required to reshoot the course of fire" },
                    { rule: "9.1.4", condition: "Targets not properly patched/taped for scoring, with extra scoring or questionable penalty hits", action: "Range Officer must judge if accurate score possible; if not, competitor must reshoot" },
                    { rule: "9.1.4.1", condition: "Patches/tape on restored target blown off by wind or muzzle blast with ambiguous hits", action: "Competitor will be required to reshoot the course of fire" },
                    { rule: "9.1.5.1", condition: "Bullet strikes wholly through scoring area of one paper target and into another paper target", action: "Hit on subsequent paper target will NOT count for score or penalty" },
                    { rule: "9.1.5.2", condition: "Bullet strikes wholly through scoring area of paper target and strikes down a metal target", action: "Treated as range equipment failure; competitor will be required to reshoot" },
                    { rule: "9.1.5.3", condition: "Bullet strikes partially within scoring area of one target and continues to another paper target", action: "Hit on subsequent paper target WILL count for score or penalty" },
                    { rule: "9.1.5.4", condition: "Bullet strikes partially within scoring area and strikes down another metal target", action: "Fallen metal target WILL count for score or penalty" },
                    { rule: "9.1.6.1", condition: "Bullet strikes wholly through hard cover and continues to paper target or no-shoot", action: "Hit on paper target or no-shoot will NOT count; if unclear, ignore highest scoring hits" },
                    { rule: "9.1.6.2", condition: "Bullet strikes wholly through hard cover and strikes down a metal target", action: "Treated as range equipment failure; competitor will be required to reshoot. See also Rule 4.7.1." },
                    { rule: "9.1.6.3", condition: "Bullet strikes partially through hard cover and continues to paper target", action: "Hit on paper target WILL count for score or penalty" },
                    { rule: "9.1.6.4", condition: "Bullet strikes partially through hard cover and strikes down metal target/no-shoot", action: "Fallen/hit metal target/no-shoot WILL count for score or penalty" },
                    { rule: "9.1.7", condition: "Shots pass through target sticks and hit paper or metal targets", action: "Hits on paper or metal targets WILL count for score or penalty (target sticks not cover)" },
                    { rule: "9.4.2", condition: "Visible hits on scoring area of paper no-shoot", action: "Penalized minus 10 points per hit, maximum 2 hits per no-shoot" }
                ]
            }
        };

        // Initialize
        let currentFilter = 'all';
        let searchTerm = '';
        let expandedSections = new Set(); // Track manually expanded sections when filter is 'all'

        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const sectionsContainer = document.getElementById('sectionsContainer');
        const statsContainer = document.getElementById('statsContainer');
         const modal = document.getElementById('ruleModal');
         const modalCloseBtn = document.getElementById('modalCloseBtn');
         const clearBtn = document.getElementById('clearBtn');

         // Event listeners
         searchInput.addEventListener('input', (e) => {
             searchTerm = e.target.value.toLowerCase();
             render();
         });

         clearBtn.addEventListener('click', () => {
             searchInput.value = '';
             searchTerm = '';
             render();
             searchInput.focus();
         });

         filterButtons.forEach(btn => {
             btn.addEventListener('click', () => {
                 filterButtons.forEach(b => b.classList.remove('active'));
                 btn.classList.add('active');
                 currentFilter = btn.dataset.filter;
                 render();
                 updateFilterButtonCounts();
             });
         });

         // Language switcher event listeners
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });

        // Initialize UI with saved/default language
        setLanguage(currentLang);

        // Initialize filter button counts on page load
         updateFilterButtonCounts();

        modalCloseBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Keyboard escape to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // Language switching functions
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('ipscRulesLang', lang);

            // Update button states
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // Update all UI
            updateAllUI();
        }

        function updateAllUI() {
            const t = translations[currentLang].ui;

            // Update page title and header
            document.title = t.pageTitle;
            document.getElementById('pageHeader').textContent = t.pageHeader;

            // Update search placeholder
            searchInput.placeholder = t.searchPlaceholder;

            // Update filter buttons
            document.querySelector('[data-filter="all"]').innerHTML = t.filterAll;
            document.querySelector('[data-filter="warnings"]').innerHTML = t.filterWarn;
            document.querySelector('[data-filter="procedures"]').innerHTML = t.filterProc;
            document.querySelector('[data-filter="disqualifications"]').innerHTML = t.filterDQ;
            document.querySelector('[data-filter="reshoots"]').innerHTML = t.filterReshoot;
            document.querySelector('[data-filter="scoring"]').innerHTML = t.filterScoring;

            // Re-add counts to filter buttons after updating labels
            updateFilterButtonCounts();

            // Update footer
            document.querySelector('footer p:nth-child(1)').innerHTML = `<strong>Document Source:</strong> ${t.docSource}`;
            document.querySelector('footer p:nth-child(2)').innerHTML = t.lastUpdated;
            document.querySelector('footer p:nth-child(3)').innerHTML = t.clickTip;

            // Re-render content
            render();
        }

        // Render functions
        function render() {
            const visibleSections = getVisibleSections();
            renderStats(visibleSections);
            renderSections(visibleSections);
        }

        function getVisibleSections() {
            let sections = Object.values(rulesData);

            if (currentFilter !== 'all') {
                sections = sections.filter(s => s.type === currentFilter);
            }

            if (searchTerm) {
                sections = sections.map(section => ({
                    ...section,
                    rows: section.rows.filter(row => 
                        row.rule.toLowerCase().includes(searchTerm) ||
                        row.condition.toLowerCase().includes(searchTerm) ||
                        row.action.toLowerCase().includes(searchTerm)
                    )
                })).filter(s => s.rows.length > 0);
            }

            return sections;
        }

        function renderStats(visibleSections) {
            const totalRules = visibleSections.reduce((sum, s) => sum + s.rows.length, 0);

            let html = `
                <div class="stat-card">
                    <div class="stat-number">${totalRules}</div>
                    <div class="stat-label">${translations[currentLang].ui.statsRules}</div>
                </div>
            `;

            statsContainer.innerHTML = html;
        }

        function renderSections(visibleSections) {
            if (visibleSections.length === 0) {
                sectionsContainer.innerHTML = `
                    <div class="no-results">
                        <p>${translations[currentLang].ui.noResults}</p>
                    </div>
                `;
                return;
            }

            let html = '';
            visibleSections.forEach((section, idx) => {
                html += renderSection(section, idx, searchTerm);
            });

            sectionsContainer.innerHTML = html;

            // Add event listeners to section headers
            document.querySelectorAll('.section-header').forEach(header => {
                header.addEventListener('click', function() {
                    const section = this.closest('.section');
                    section.classList.toggle('collapsed');

                    // Update expandedSections Set only when filter is 'all'
                    if (currentFilter === 'all') {
                        const sectionType = section.dataset.type;
                        if (section.classList.contains('collapsed')) {
                            expandedSections.delete(sectionType);
                        } else {
                            expandedSections.add(sectionType);
                        }
                    }
                });
            });

            // Add event listeners to rule numbers
            document.querySelectorAll('.rule-number').forEach(ruleBtn => {
                ruleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const ruleNum = ruleBtn.textContent.trim();
                    openModal(ruleNum);
                });
            });

            // Add event listeners to inline rule numbers in action column
            document.querySelectorAll('.rule-number-inline').forEach(ruleBtn => {
                ruleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const ruleNum = ruleBtn.textContent.trim();
                    openModal(ruleNum);
                });
            });
        }

        function renderSection(section, idx, hasSearch) {
            const t = translations[currentLang].ui;

            // Get translated title and description
            const sectionTitle = section.titleKey ? t[section.titleKey] : section.title;
            const sectionDesc = section.descKey ? t[section.descKey] : section.description;

            // Determine if section should be expanded
            let headerClass;
            if (hasSearch || currentFilter !== 'all') {
                // Search active or specific filter selected: always expand
                headerClass = '';
            } else {
                // Filter is 'all' with no search: check if user manually expanded this section
                headerClass = expandedSections.has(section.type) ? '' : 'collapsed';
            }

            let html = `
                <div class="section ${headerClass}" data-type="${section.type}">
                    <div class="section-header">
                        <span style="flex: 1; min-width: 0; overflow-wrap: break-word;">${sectionTitle}</span>
                        <span class="toggle-icon">▶</span>
                    </div>
                    <div class="section-content">
                        <div class="content-wrapper">
                            <div class="section-description">${sectionDesc}</div>
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width: 20%; min-width: 50px;">${t.tableHeaderRule}</th>
                                        <th style="width: 40%; min-width: 100px;">${t.tableHeaderCondition}</th>
                                        <th style="width: 40%; min-width: 100px;">${t.tableHeaderAction}</th>
                                    </tr>
                                </thead>
                                <tbody>
            `;

            section.rows.forEach(row => {
                html += `
                    <tr>
                        <td><span class="rule-number">${highlightSearch(row.rule)}</span></td>
                        <td>${stylizeTags(highlightSearch(row.condition))}</td>
                        <td>${makeRuleNumbersClickable(stylizeTags(highlightSearch(row.action)), true)}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;

            return html;
        }

        function highlightSearch(text) {
            if (!searchTerm) return text;
            const regex = new RegExp(`(${searchTerm})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function makeRuleNumbersClickable(text, isActionColumn = false) {
            // Only make rule numbers clickable in the Action column
            if (!isActionColumn) {
                return text;
            }
            
            // Match rule numbers like 10.6.1, 8.3.1.1, 2.3.4.1 etc. but not decimals like 1.8 or 3 meters
            // Rule numbers should have at least 3 parts separated by dots (e.g., X.Y.Z)
            // and should NOT be preceded/followed by other digits (word boundary)
            const ruleRegex = /\b(\d+\.\d+\.\d+(?:\.\d+)*)\b/g;
            return text.replace(ruleRegex, '<span class="rule-number-inline">$1</span>');
        }

        function stylizeTags(text) {
            // Replace [GRANTED] tags with styled spans (without brackets)
            text = text.replace(/\[GRANTED\]/g, '<span class="tag-granted">GRANTED</span>');
            // Replace [DENIED] tags with styled spans (without brackets)
            text = text.replace(/\[DENIED\]/g, '<span class="tag-denied">DENIED</span>');
            // Replace [REFUSED] tags with styled spans (without brackets)
            text = text.replace(/\[REFUSED\]/g, '<span class="tag-refused">REFUSED</span>');
            return text;
        }

        function openModal(ruleNum) {
            // Handle rule ranges like "10.1.1-10.1.4"
            if (ruleNum.includes('-')) {
                const parts = ruleNum.split('-');
                const startRule = parts[0].trim();
                const endRule = parts[1].trim();
                
                // Parse start and end rule numbers
                const startParts = startRule.split('.').map(Number);
                const endParts = endRule.split('.').map(Number);
                
                // Generate all rules in the range
                let rulesInRange = [];
                if (startParts.length === 3 && endParts.length === 3 &&
                    startParts[0] === endParts[0] && startParts[1] === endParts[1]) {
                    // Range like 10.1.1-10.1.4
                    const base = `${startParts[0]}.${startParts[1]}`;
                    for (let i = startParts[2]; i <= endParts[2]; i++) {
                        rulesInRange.push(`${base}.${i}`);
                    }
                }
                
                // Build modal content with all rules
                let modalContent = '';
                rulesInRange.forEach((rule, idx) => {
                    const text = translations[currentLang].fullRuleText[rule] ||
                        `${translations[currentLang].ui.tableHeaderRule} ${rule} - ${translations[currentLang].ui.ruleNotAvailable}`;
                    modalContent += text;
                    if (idx < rulesInRange.length - 1) {
                        modalContent += '\n\n---\n\n';
                    }
                });
                
                document.getElementById('modalRuleNumber').textContent = ruleNum;
                document.getElementById('modalBody').textContent = modalContent;
            } else {
                const fullText = translations[currentLang].fullRuleText[ruleNum] ||
                    `${translations[currentLang].ui.tableHeaderRule} ${ruleNum} - ${translations[currentLang].ui.ruleNotAvailable}`;
                document.getElementById('modalRuleNumber').textContent = ruleNum;
                document.getElementById('modalBody').textContent = fullText;
            }
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

         function closeModal() {
             modal.classList.remove('active');
             document.body.style.overflow = '';
         }

         function updateFilterButtonCounts() {
             const filterMap = {
                 'all': null,
                 'warnings': 'warnings',
                 'procedures': 'procedures',
                 'disqualifications': 'disqualifications',
                 'reshoots': 'reshoots',
                 'scoring': 'scoring'
             };

             filterButtons.forEach(btn => {
                 const filterType = btn.dataset.filter;
                 let count = 0;

                 if (filterType === 'all') {
                     count = Object.values(rulesData).reduce((sum, section) => sum + section.rows.length, 0);
                 } else {
                     const section = Object.values(rulesData).find(s => s.type === filterType);
                     if (section) {
                         count = section.rows.length;
                     }
                 }

                 // Get the button text without the count
                 const originalText = btn.textContent.replace(/\s*\(\d+\)$/, '');
                 btn.textContent = `${originalText} (${count})`;
             });
         }

         // Initial render
         render();
    </script>
</body>
</html>
